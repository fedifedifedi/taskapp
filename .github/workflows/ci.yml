name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une nouvelle exÃ©cution sur la mÃªme branche annule la prÃ©cÃ©dente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Base PostgreSQL fournie par le service de chaque job.
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskapp_test
  E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskapp_test

jobs:
  quality:
    name: Lint, format, typecheck, audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Seuil "critical" : les alertes "high" connues de la CLI Prisma sont documentÃ©es dans le README.
      - run: npm audit --omit=dev --audit-level=critical

  test:
    name: Tests unitaires et d'intÃ©gration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskapp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run test -w @taskapp/shared
      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: apps/api/coverage/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: Tests E2E (Playwright, build de production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskapp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Version de Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache des navigateurs Playwright
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Installation de Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: DÃ©pendances systÃ¨me de Chromium (cache prÃ©sent)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run test:e2e

      - name: Rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Image Docker (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskapp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskapp
      JWT_SECRET: ci-smoke-secret-with-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build de l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: taskapp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # MÃªme commande que le pre-deploy Railway.
      - name: Migrations depuis l'image
        run: >-
          docker run --rm --network host -e DATABASE_URL
          taskapp:ci npm run db:deploy

      - name: DÃ©marrage du conteneur
        run: >-
          docker run -d --name taskapp --network host
          -e DATABASE_URL -e JWT_SECRET -e PORT=3000
          taskapp:ci

      - name: Smoke test (santÃ©, SPA, inscription, utilisateur non root)
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health && break
            sleep 1
          done
          curl -fsS http://localhost:3000/api/health | grep -q '"database":"ok"'
          curl -fsS http://localhost:3000/tasks | grep -q '<div id="root">'
          curl -fsS -o /dev/null -w '%{http_code}\n' \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","name":"Smoke","password":"Password1"}' \
            http://localhost:3000/api/v1/auth/register | grep -q 201
          test "$(docker exec taskapp id -u)" != "0"

      - name: Logs du conteneur
        if: failure()
        run: docker logs taskapp
