# Base de données locale pour le développement et les tests.
# Usage : npm run db:up
services:
  db:
    image: postgres:17-alpine
    container_name: taskapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskapp
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d taskapp']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
